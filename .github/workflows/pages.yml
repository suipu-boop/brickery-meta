# brickery-meta 导航页自动部署：push main → gh-pages
#
# index.html 为生态静态导航页，变更自动同步到
# https://suipu-boop.github.io/brickery-meta/
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 部署站点到 gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: false

      - name: 发布报告
        run: |
          echo "## 导航页已部署" >> "$GITHUB_STEP_SUMMARY"
          echo "- 站点: https://suipu-boop.github.io/brickery-meta/" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
